name: Report giornaliero

on:
  schedule:
    # 06:10 UTC = 08:10 in Italia (ora legale) / 07:10 (ora solare).
    # Abbastanza tardi perché l'orologio abbia sincronizzato la notte.
    - cron: "10 6 * * *"
    # Secondo passaggio per chi sincronizza più tardi.
    - cron: "10 10 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # I dati grezzi restano solo nella cache di Actions: mai nel repository.
      - name: Ripristina i dati già scaricati
        uses: actions/cache/restore@v4
        with:
          path: data/raw
          key: garmin-raw-${{ github.run_id }}
          restore-keys: |
            garmin-raw-

      - name: Scarica da Garmin
        env:
          GARMIN_TOKEN: ${{ secrets.GARMIN_TOKEN }}
        run: python -u scripts/fetch_data.py --days 120 --refresh-days 4

      - name: Genera il sito cifrato
        env:
          SITE_PASSPHRASE: ${{ secrets.SITE_PASSPHRASE }}
        run: python -u scripts/build_site.py

      - name: Salva i dati per il giorno dopo
        uses: actions/cache/save@v4
        if: always()
        with:
          path: data/raw
          key: garmin-raw-${{ github.run_id }}

      # enablement attiva Pages da sola al primo giro: nessun passaggio manuale
      # in Settings → Pages.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
